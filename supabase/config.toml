# Supabase local development configuration.
# Docs: https://supabase.com/docs/guides/cli/config
project_id = "negolinks"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
# Local email testing UI (captures confirmation/magic-link emails).
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# For local dev use the Vite dev server; for production set these to your domain.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://school.negolinks.com"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Local: let accounts work immediately without clicking a confirmation email.
# In hosted production, turn confirmations back ON (Dashboard -> Authentication).
enable_confirmations = false

[edge_runtime]
enabled = true
